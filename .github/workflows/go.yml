name: go

on:
  push:
    paths:
      - 'services/**'
      - '.github/workflows/go.yml'
  pull_request:
    paths:
      - 'services/**'
      - '.github/workflows/go.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache-dependency-path: services/go.sum
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache-dependency-path: services/go.sum
      - uses: golangci/golangci-lint-action@v6
        with:
          working-directory: services
