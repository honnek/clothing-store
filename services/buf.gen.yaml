version: v2
plugins:
  - local: protoc-gen-go
    out: api/gen
    opt: paths=source_relative
  - local: protoc-gen-go-grpc
    out: api/gen
    opt: paths=source_relative
  - local: protoc-gen-grpc-gateway
    out: api/gen
    opt: paths=source_relative
  - local: protoc-gen-openapiv2
    out: internal/catalog/transport/openapi
    opt: allow_merge=true,merge_file_name=catalog
